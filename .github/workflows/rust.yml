name: Rust

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set crate version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' must look like v1.2.3"
          }
          $version = $tag.Substring(1)
          $toml = Get-Content Cargo.toml -Raw
          $updated = [regex]::Replace(
            $toml,
            '(?m)^version\s*=\s*"[^"]+"',
            "version = `"$version`"",
            1
          )
          if ($updated -eq $toml) { throw "Failed to update version in Cargo.toml" }
          Set-Content Cargo.toml $updated -NoNewline
          Write-Host "Cargo.toml version -> $version"
      - name: Install cargo-binstall
        uses: taiki-e/install-action@cargo-binstall
      - name: Install Dioxus CLI
        shell: pwsh
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "overnotes" } | Select-Object -First 1
          $versionReq = ($package.dependencies | Where-Object { $_.name -eq "dioxus" } | Select-Object -First 1).req
          $dioxusVersion = (($versionReq -replace '^[=^~>< ]+', '') -split ',')[0].Trim()
          Write-Host "Installing dioxus-cli $dioxusVersion to match dioxus dependency $versionReq"
          cargo binstall dioxus-cli --version $dioxusVersion --locked --no-confirm
      - name: Build release
        run: cargo build --release --bin overnotes
      - name: Bundle desktop release
        run: dx bundle --desktop --release --out-dir dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
